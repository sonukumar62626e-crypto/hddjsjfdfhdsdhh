name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Set India Time Zone (IST)
        run: |
          tzutil /s "India Standard Time"
          Write-Host "Time Zone set to: $(tzutil /g)"
          Write-Host "Current Indian Time: $(Get-Date)"

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Disable NLA for easier connection
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          
          # Firewall rules
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          New-NetFirewallRule -DisplayName "RDP-Tailscale" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue
          
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5
          Write-Host "RDP configured successfully"

      - name: Create RDP User
        run: |
          $password = "Kumar@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP" -Confirm:$false
              Start-Sleep -Seconds 2
          }
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          Set-LocalUser -Name "RDP" -PasswordNeverExpires $true
          
          echo "RDP_CREDS=User: RDP | Password: Kumar@123" >> $env:GITHUB_ENV
          Write-Host "User 'RDP' created successfully"

      - name: Install Latest Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.1-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Write-Host "Downloading Tailscale 1.104.1..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10
          
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale install failed"
              exit 1
          }
          Write-Host "Tailscale installed successfully"

      - name: Connect Tailscale
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          Write-Host "Connecting to Tailscale..."
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --accept-dns=false
          
          $tsIP = $null
          $retries = 0
          
          while (-not $tsIP -and $retries -lt 25) {
              Start-Sleep -Seconds 6
              $tsIP = (& $tsExe ip -4 2>$null).Trim()
              $retries++
              Write-Host "Waiting for IP... ($retries/25)"
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP nahi mila. Auth Key check karo (Reusable hona chahiye)."
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "========================================"
          Write-Host "Tailscale Connected Successfully!"
          Write-Host "IP Address: $tsIP"
          Write-Host "========================================"
          & $tsExe status

      - name: Verify RDP Port
        run: |
          Start-Sleep -Seconds 5
          $portCheck = Get-NetTCPConnection -LocalPort 3389 -ErrorAction SilentlyContinue
          if ($portCheck) {
              Write-Host "RDP Port 3389 is listening - Ready to connect"
          } else {
              Write-Warning "Port check failed, but still try connecting"
          }

      - name: Keep Alive + Show Details
        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "          RDP ACCESS DETAILS"
          Write-Host "============================================"
          Write-Host "Address     : $env:TAILSCALE_IP"
          Write-Host "Username    : RDP"
          Write-Host "Password    : Kumar@123"
          Write-Host "Time Zone   : India Standard Time (IST)"
          Write-Host "Current Time: $(Get-Date)"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "Apne PC pe Tailscale login karke is IP se RDP karo."
          Write-Host ""
          
          while ($true) {
              Write-Host "[$(Get-Date -Format 'dd-MM-yyyy HH:mm:ss')] RDP Active (IST) - Cancel karne ke liye workflow cancel karo"
              Start-Sleep -Seconds 300
          }
